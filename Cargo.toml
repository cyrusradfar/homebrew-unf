[package]
name = "unfudged"
version = "0.21.2"
edition = "2021"
description = "Filesystem flight recorder — never lose a file change again"
license = "MIT OR Apache-2.0"
keywords = ["filesystem", "backup", "undo", "watcher", "recovery"]
categories = ["command-line-utilities", "filesystem"]
repository = "https://github.com/cyrusradfar/homebrew-unf"
homepage = "https://github.com/cyrusradfar/homebrew-unf"

[[bin]]
name = "unf"
path = "src/main.rs"

# Cognitive complexity is a HARD ERROR at the threshold in clippy.toml (12).
# The lint is nursery/allow-by-default, so `cognitive-complexity-threshold`
# sat in clippy.toml doing nothing at all until this section was added.
#
# Declared here rather than as `#![warn(...)]` in lib.rs so it covers the bins
# too. `code/` is not a workspace -- app/ is a separate crate with its own
# lockfile -- so this cannot leak into the desktop app.
#
# No baseline and no ratchet: only one violation ever existed, and it is fixed.
# File and function length are the metrics that need a baseline; see
# scripts/check-code-size.sh.
[lints.clippy]
cognitive_complexity = "warn"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# File watching
notify = "8"

# Content hashing
blake3 = "1"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Time handling
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
humantime = "2"

# Diff output
similar = "2"

# .gitignore parsing
ignore = "0.4"

# Glob pattern matching
globset = "0.4"

# Error handling
thiserror = "2"
anyhow = "1"

# JSON serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Home directory detection
dirs = "6"

# File locking (flock)
fs2 = "0.4"

# Graceful shutdown signal handling
ctrlc = { version = "3", features = ["termination"] }

# Signal handling for inter-process communication
signal-hook = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
serde_json = "1"
libc = "0.2"
